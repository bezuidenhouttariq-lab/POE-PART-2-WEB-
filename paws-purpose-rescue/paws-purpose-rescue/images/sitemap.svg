<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #8fa37e; stroke-width: 2; rx: 10; }
    .home { fill: #8fa37e; stroke: #6d8564; }
    .label { font-size: 15px; fill: #332e2a; text-anchor: middle; }
    .home-label { fill: #ffffff; font-weight: 700; }
    .line { stroke: #e0d5bd; stroke-width: 2; }
  </style>

  <!-- Home node -->
  <rect class="box home" x="320" y="20" width="120" height="46" rx="10"/>
  <text class="label home-label" x="380" y="48">index.html</text>

  <!-- connecting lines -->
  <line class="line" x1="380" y1="66" x2="90"  y2="150"/>
  <line class="line" x1="380" y1="66" x2="270" y2="150"/>
  <line class="line" x1="380" y1="66" x2="450" y2="150"/>
  <line class="line" x1="380" y1="66" x2="630" y2="150"/>

  <!-- child nodes -->
  <rect class="box" x="30"  y="150" width="120" height="46" rx="10"/>
  <text class="label" x="90" y="178">about.html</text>

  <rect class="box" x="210" y="150" width="130" height="46" rx="10"/>
  <text class="label" x="275" y="172">services.html</text>
  <text class="label" x="275" y="188" font-size="11">(Adopt &amp; Get Involved)</text>

  <rect class="box" x="390" y="150" width="120" height="46" rx="10"/>
  <text class="label" x="450" y="178">enquiry.html</text>

  <rect class="box" x="570" y="150" width="120" height="46" rx="10"/>
  <text class="label" x="630" y="178">contact.html</text>

  <text class="label" x="380" y="260" font-size="12" fill="#6b6259">
    Every page shares the same header navigation and footer, so any page is reachable in one click from any other.
  </text>
</svg>
